server:
  port: ${SERVER_PORT:****}

spring:
  application:
    name: SmartAlumni IIT - Mentorat Platform

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:****/mentorat_platform}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  refresh-expiration: 604800000

# File Upload
app:
  upload:
    cv-dir: uploads/cv/
    titre-dir: uploads/titres/
    photo-dir: uploads/photos/

  ai:
    service:
      url: ${AI_SERVICE_URL:http://localhost:****}
      endpoints:
        match: /api/match
        trends: /api/trends
      timeout: 10000

# Springdoc / Swagger
springdoc:
  packages-to-scan: tn.IIT.mentorat_platform.controller

  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

  info:
    title: SmartAlumni IIT API
    description: API REST pour la plateforme de mentorat Alumni-Etudiants
    version: 1.0.0

# Logging
logging:
  level:
    tn.IIT.mentorat_platform: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

# DeepSeek CV Analysis
ai:
  deepseek:
    enabled: ${DEEPSEEK_ENABLED:true}
    api-key: ${DEEPSEEK_API_KEY}
    base-url: https://api.deepseek.com
    model: deepseek-chat
    timeout-seconds: 30