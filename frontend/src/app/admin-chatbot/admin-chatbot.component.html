<div class="chat-container">
  <div class="chat-header">
    <h3>🤖 Assistant IA Alumni</h3>
    <p>Posez-moi des questions sur les statistiques !</p>
  </div>
  
  <div class="chat-messages" #scrollMe>
    <div *ngIf="messages.length === 0" class="empty-state">
      Bonjour ! Demandez-moi quelles sont les tendances d'embauche ou la meilleure spécialité.
    </div>
    
    <div *ngFor="let msg of messages" [ngClass]="['message-bubble', msg.role]">
      <strong>{{ msg.role === 'admin' ? 'Vous' : 'IA' }}</strong>
      <p>{{ msg.text }}</p>
    </div>
    
    <div *ngIf="loading" class="message-bubble ai loading">
      <span>.</span><span>.</span><span>.</span>
    </div>
  </div>
  
  <div class="chat-input">
    <input 
      [(ngModel)]="question" 
      placeholder="Écrivez votre question ici..." 
      (keyup.enter)="ask()" 
      [disabled]="loading"
    />
    <button (click)="ask()" [disabled]="loading || !question.trim()">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
        <path d="M15.854.146a.5.5 0 0 1 .11.54l-5.819 14.547a.75.75 0 0 1-1.329.124l-3.178-4.995L.643 7.184a.75.75 0 0 1 .124-1.33L15.314.037a.5.5 0 0 1 .54.11ZM6.636 10.07l2.761 4.338L14.13 2.576zm6.787-8.201L1.591 6.602l4.339 2.76 7.494-7.493Z"/>
      </svg>
    </button>
  </div>
</div>
